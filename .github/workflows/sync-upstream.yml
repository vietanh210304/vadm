name: Sync non-torrent upstream updates

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Fetch upstream MDM
        run: |
          git config user.name "vadm-sync-bot"
          git config user.email "vadm-sync-bot@users.noreply.github.com"
          git remote add upstream https://github.com/anefzaoui/misterdownloadmanager.git || true
          git fetch upstream main

      - name: Filter and cherry-pick non-torrent commits
        id: sync
        run: |
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          BRANCH="sync/upstream-$STAMP"
          git checkout -b "$BRANCH"
          python3 tools/release/sync_upstream.py upstream/main
          if git diff --quiet && git diff --cached --quiet && [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add .github/upstream-sync-sha
          if ! git diff --cached --quiet; then
            git commit -m "chore: update upstream sync marker"
          fi
          git push -u origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="Automated non-torrent upstream sync."
          if [ -f SYNC_SUMMARY.md ]; then
            BODY="$(cat SYNC_SUMMARY.md)"
          fi
          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "${{ steps.sync.outputs.branch }}" \
            --title "chore: sync non-torrent updates from upstream MDM" \
            --body "$BODY"
